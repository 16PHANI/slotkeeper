services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - slotkeeper-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/SlotKeeper.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__SlotKeeperDb: "Server=sqlserver,1433;Database=SlotKeeper;User Id=sa;Password=Your_password123;TrustServerCertificate=True;"
      Jwt__SigningKey: "local-dev-signing-key-replace-me-before-deploying-anywhere-real"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "8080:8080"

volumes:
  slotkeeper-sql-data:
